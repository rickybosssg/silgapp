name: Submit authorized iOS submission
on:
  push:
    branches: ['ios-submit-1.0.68-b77']
    paths: ['.github/workflows/ios-review-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Submit exact approved version77 for Apple review
        env:
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: python3 scripts/ios_submit_review77.py
