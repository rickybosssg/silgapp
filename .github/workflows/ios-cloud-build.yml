name: iOS unsigned build check
on:
  push:
    tags: ['ios-check-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate App Store Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || { echo '::error::Reviewed Xcode installation is unavailable'; exit 1; }
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / {split($2, parts, "."); print parts[1]}')"
          SDK_MAJOR="$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)"
          test "$XCODE_MAJOR" -ge 26 && test "$SDK_MAJOR" -ge 26 || { echo '::error::App Store requires Xcode 26 and iOS SDK 26 or later'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Restore existing Firebase iOS configuration
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.IOS_FIREBASE_CONFIG_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$FIREBASE_CONFIG_BASE64" || { echo '::error::Missing IOS_FIREBASE_CONFIG_BASE64'; exit 1; }
          printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist
          python3 scripts/ios_release.py firebase --path ios/App/App/GoogleService-Info.plist
      - name: Install and build web application
        env:
          VITE_BASE44_APP_ID: 6a0ec08f3af5e1d1284254c1
          VITE_BASE44_APP_BASE_URL: https://silga-dispatch-go.base44.app
          VITE_BASE44_FUNCTIONS_VERSION: prod
        run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update
      - name: Check native property lists
        run: plutil -lint ios/App/App/Info.plist ios/App/App/App.entitlements ios/App/App.xcodeproj/project.pbxproj
      - name: Compile simulator without signing
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/silgapp-simulator" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Capture native logged-out iPhone screen without review credentials
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/silgapp-devices.json"
          DEVICE_ID="$(python3 - "$RUNNER_TEMP/silgapp-devices.json" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))['devices']
          choices = [(runtime, device) for runtime, rows in devices.items()
                     if 'iOS-26' in runtime for device in rows
                     if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not choices:
              raise SystemExit('No existing iOS 26 iPhone simulator is available')
          choices.sort(key=lambda item: (item[0], 'Pro Max' in item[1]['name'], item[1]['name']), reverse=True)
          print(choices[0][1]['udid'])
          PY
          )"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH="$RUNNER_TEMP/silgapp-simulator/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/silgapp-native-captures"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.base6a0ec08f3af5e1d1284254c1.app
          sleep 12
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/silgapp-native-captures/iphone-logged-out.png"
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/silgapp-native-captures/iphone-logged-out-later.png"
          python3 - "$APP_PATH/Info.plist" "$RUNNER_TEMP/silgapp-native-captures/provenance.json" <<'PY'
          import json, os, plistlib, sys
          with open(sys.argv[1], 'rb') as handle:
              info = plistlib.load(handle)
          result = {'source_commit': os.environ['GITHUB_SHA'], 'native_simulator': True,
                    'distribution_build': False, 'review_credentials_used': False,
                    'bundle_id': info['CFBundleIdentifier'], 'sdk': info.get('DTSDKName'),
                    'scope': 'Actual native logged-out UI only; no account, course, payment or test push action'}
          with open(sys.argv[2], 'w') as handle:
              json.dump(result, handle, indent=2)
          PY
          xcrun simctl shutdown "$DEVICE_ID"
      - name: Keep only native logged-out screenshots and provenance
        uses: actions/upload-artifact@v4
        with:
          name: SILGAPP-native-simulator-captures
          path: ${{ runner.temp }}/silgapp-native-captures/
          if-no-files-found: error
          retention-days: 1
      - name: Remove restored local configuration
        if: always()
        run: rm -f ios/App/App/GoogleService-Info.plist
